# ================================================
# Configuração do Banco de Dados - PostgreSQL
# ================================================
# NOTA SEGURANÇA: A senha DEVE ser fornecida via
# variável de ambiente DB_PASSWORD, nunca em arquivo.
# ================================================

# URL de conexão do PostgreSQL
db.url=jdbc:postgresql://localhost:5432/tartaruga_cometa_db

# Usuário do banco de dados
db.username=tartaruga_user

# Senha do banco de dados
# NÃO PREENCHER AQUI - Usar variável de ambiente DB_PASSWORD
db.password=

# Driver JDBC
db.driver=org.postgresql.Driver

# Configurações do Pool de Conexões
db.pool.minSize=5
db.pool.maxSize=20
db.pool.timeout=30000
